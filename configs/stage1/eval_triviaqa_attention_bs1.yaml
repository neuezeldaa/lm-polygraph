# =============================================================================
# Stage 1 FROZEN experiment config — Spilled Energy baseline harness.
#
# Every later Stage (2+) reuses this file UNCHANGED for identical model / dataset
# / generation settings. Do not hand-edit constants at run time; override on the
# CLI only for throwaway debugging, never for reported numbers.
#
# Run with:
#   HYDRA_CONFIG=$(pwd)/configs/stage1/eval_triviaqa_qwen.yaml polygraph_eval
# (or via the runner: python stage1_run_baselines.py — see docs/stage1_baselines.md)
#
# SECONDARY table: the four attention-based baselines at batch_size=1 with
# eager attention. Same model / dataset / decoding / seed as the primary config;
# only batch_size, attn_implementation, output_attentions, n and the estimator
# list differ. Because the fix removes the batch-size dependence of generation,
# the generations here must be IDENTICAL to the primary run's for the samples
# they share -- harness/check_run_consistency.py verifies that by hash.
#
# n is 300 rather than 1000: batch_size=1 is roughly 2x slower per sample.
#
# Model:    Qwen/Qwen2.5-3B-Instruct, fp16, EAGER attention (see note above)
# Dataset:  LM-Polygraph/triviaqa (continuation subset), test split
# Decoding: greedy (do_sample=false), max_new_tokens=20, stop on newline, 5-shot
# Quality:  AccuracyMetric = normalized exact match (recon §6)
# Metric:   normalized PRR@0.5  -> results key "prr_0.5_normalized"
#           (PredictionRejectionArea(max_rejection=0.5) is registered by the eval
#            script automatically; recon §5)
# Seed:     1  (transformers.set_seed; greedy decoding => deterministic given seed)
# =============================================================================

hydra:
  run:
    dir: ${cache_path}/${task}/${model.path}/${dataset}/${now:%Y-%m-%d}/${now:%H-%M-%S}

defaults:
  - model: qwen2.5-3b-instruct
  - estimators: attention_bs1
  - stat_calculators: auto
  - base_processing_triviaqa
  - _self_

cache_path: ./workdir/stage1
save_path: '${hydra:run.dir}'

task: qa
instruct: false            # continuation-style few-shot, matching lm-polygraph's published TriviaQA protocol

# --- dataset ---------------------------------------------------------------
dataset: ['LM-Polygraph/triviaqa', 'continuation']
text_column: input
label_column: output
train_split: train
eval_split: test
few_shot_split: train
n_shot: 5
load_from_disk: false
trust_remote_code: false
multiref: true             # TriviaQA has multiple gold answers -> AggregatedMetric(max)
size: 10000                  # cap rows loaded before subsampling
subsample_eval_dataset: 300 # n>=1000: at n=300 the PRR spread (~+-0.05) cannot
                             # support a baseline-vs-method claim. Override with
                             # --samples for quick debugging only, never for
                             # reported numbers.

# --- generation (frozen) ---------------------------------------------------
max_new_tokens: 20
generation_params:
  do_sample: false
  num_beams: 1
  temperature: 1.0
  stop_strings:
    - "\n"

# --- quality / correctness function ---------------------------------------
generation_metrics:
  - name: AccuracyMetric   # normalized exact match (with base_processing_triviaqa)

# --- caching: persist greedy generations so Stage 2 need not re-run the LLM --
save_stats:
  - greedy_texts
  - greedy_tokens
  - greedy_log_likelihoods
  # Persisted so the WITHIN-PASS invariant can be checked on real data:
  # tok - lse is a log-probability and must be <= 0 for every token. That one is
  # exact by construction, unlike the cross-pass identity against
  # greedy_log_likelihoods, which legitimately diverges in fp16 because the two
  # sides come from different forward passes.
  - energy_token_logits
  - energy_lse

# TRUE here, unlike the primary config: these estimators consume attention maps.
# That disables transformers' left-padding NaN guard, which is safe ONLY because
# batch_size is 1 below -- with a single sequence per batch there is no padding,
# so no attention row is ever fully masked and the fp16 overflow cannot occur.
# Do NOT raise batch_size in this config.
output_attentions: true

# Override the model group's sdpa: these estimators need eager attention maps.
# Safe ONLY at batch_size=1 (no padding => no fully-masked row => no fp16 overflow).
model:
  load_model_args:
    attn_implementation: eager

ignore_exceptions: false
batch_size: 1
seed:
  - 1
