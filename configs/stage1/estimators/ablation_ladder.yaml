# Ablation ladder — isolates WHICH ingredient of Spilled Energy earns any win.
#
# SpilledEnergy changes two things at once relative to library baselines: the
# energy formulation, AND localisation to the answer window with pooling.
# Comparing it against whole-sequence sum/mean baselines confounds the two.
# Here every rung uses the SAME window (the generation) and the SAME three
# poolings, so adjacent rungs differ by exactly ONE ingredient:
#
#   pooled log-likelihood   log p = theta[id] - Z
#         |                 ...drop the -Z normalisation
#   E^l   (logit)           -theta[id]
#         |                 ...swap the sampled-token term for the partition
#   E^m   (marginal)        -Z
#         |                 ...take the adjacent-step residual
#   dE    (spilled)         Z_{j+1} - theta_j[id]
#         |                 ...scale by |E^m|
#   dE_s  (scaled_spilled)  |E^m| * dE
#
# Entropy comes along as a second token-level family since it is free.
#
# Window = the whole generation. With stop_strings ["\n"] and max_new_tokens 20
# the TriviaQA generation IS the short answer, mirroring how the paper obtains
# its [u, w] span (by prompting for a brief answer). It uses NO ground truth:
# locating a span by matching the gold answer would be label leakage and would
# not be available at inference. Validate with harness/validate_answer_span.py
# on the n=150 run BEFORE reporting, and re-validate for CoQA.
#
# Pooled_* live in harness/ (not the PR): lm-polygraph has no pooling
# abstraction, and proposing a general one unsolicited would stall the method PR.


